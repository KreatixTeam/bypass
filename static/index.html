<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>bypass — link bypasser</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/vuetify@3.10.9/dist/vuetify.min.css" rel="stylesheet">
<style>
  html, body, .v-application { background:#000 !important; }
  .dest { font-family:ui-monospace, Menlo, monospace; font-size:13px; word-break:break-all; }
</style>
</head>
<body>
<div id="app">
  <v-app>
    <v-app-bar flat density="compact" color="#000" style="border-bottom:1px solid #1c1c1c">
      <v-app-bar-nav-icon @click="drawer = !drawer"></v-app-bar-nav-icon>
      <v-app-bar-title class="text-body-1 font-weight-medium">Link Bypasser</v-app-bar-title>
      <v-spacer></v-spacer>
      <v-tooltip text="API docs" location="bottom">
        <template v-slot:activator="{ props }">
          <v-btn v-bind="props" icon="mdi-code-json" variant="text" density="comfortable" href="/docs" target="_blank"></v-btn>
        </template>
      </v-tooltip>
      <v-tooltip text="GitHub" location="bottom">
        <template v-slot:activator="{ props }">
          <v-btn v-bind="props" icon="mdi-github" variant="text" density="comfortable" href="https://github.com/KreatixTeam/bypass" target="_blank"></v-btn>
        </template>
      </v-tooltip>
    </v-app-bar>

    <v-navigation-drawer v-model="drawer" temporary color="#0a0a0a">
      <v-list density="compact" nav>
        <v-list-subheader style="color:#555">SUPPORTED</v-list-subheader>
        <v-list-item v-for="g in groups" :key="g.t" :title="g.t" :subtitle="g.s" style="--v-list-subtitle-color:#3a3a3a"></v-list-item>
      </v-list>
    </v-navigation-drawer>

    <v-main>
      <v-container style="max-width:860px">
        <v-breadcrumbs :items="[{title:'kreatix', href:'https://kreatix.dev'}, {title:'bypass'}]" class="pl-0 text-caption" style="color:#555"></v-breadcrumbs>

        <v-card variant="outlined" color="#0a0a0a" style="border-color:#1c1c1c; border-radius:12px">
          <v-card-text class="pa-5">
            <v-text-field
              v-model="url"
              label="Protected link"
              placeholder="https://linkvertise.com/…"
              variant="outlined"
              density="comfortable"
              hide-details="auto"
              autofocus
              spellcheck="false"
              autocomplete="off"
              prepend-inner-icon="mdi-link-variant"
              :error-messages="errMsg"
            >
              <template v-slot:append-inner>
                <v-fade-transition>
                  <v-progress-circular v-if="loading" indeterminate size="18" width="2" color="#999"></v-progress-circular>
                </v-fade-transition>
              </template>
            </v-text-field>

            <v-expand-transition>
              <div v-if="result" class="mt-4">
                <v-text-field
                  :model-value="result"
                  label="Destination"
                  variant="outlined"
                  density="comfortable"
                  readonly
                  hide-details
                  class="dest"
                  prepend-inner-icon="mdi-lock-open-variant-outline"
                >
                  <template v-slot:append-inner>
                    <v-tooltip text="copy" location="top"><template v-slot:activator="{ props }">
                      <v-btn v-bind="props" icon="mdi-content-copy" variant="text" density="comfortable" size="small" @click="copy"></v-btn>
                    </template></v-tooltip>
                    <v-tooltip text="open" location="top"><template v-slot:activator="{ props }">
                      <v-btn v-bind="props" icon="mdi-open-in-new" variant="text" density="comfortable" size="small" :href="result" target="_blank"></v-btn>
                    </template></v-tooltip>
                  </template>
                </v-text-field>
                <div class="text-caption mt-1" style="color:#444">{{ ms }}ms</div>
              </div>
            </v-expand-transition>

            <v-expand-transition>
              <v-alert v-if="err" type="error" variant="tonal" density="compact" class="mt-4 text-caption">{{ err }}</v-alert>
            </v-expand-transition>

            <div class="d-flex justify-center mt-5">
              <v-btn
                color="#4caf50"
                class="text-white text-none font-weight-medium px-10"
                height="42"
                elevation="0"
                :loading="loading"
                :disabled="!url.trim()"
                @click="crack"
              >BYPASS</v-btn>
            </div>
          </v-card-text>
        </v-card>

        <v-sheet class="d-flex flex-wrap justify-center ga-x-5 ga-y-1 mt-10" color="transparent">
          <span v-for="h in hosts" :key="h" class="text-caption" style="color:#3a3a3a">{{ h }}</span>
        </v-sheet>
        <div class="text-center text-caption mt-4" style="color:#2e2e2e">© 2026 kreatix.dev</div>
      </v-container>
    </v-main>

    <v-snackbar v-model="snack" timeout="1600" location="bottom" color="#161616">copied</v-snackbar>
  </v-app>
</div>

<script src="https://unpkg.com/vue@3.5.13/dist/vue.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vuetify@3.10.9/dist/vuetify.min.js"></script>
<script>
const { createApp, ref } = Vue;
const { createVuetify } = Vuetify;

const vuetify = createVuetify({
  theme: {
    defaultTheme: 'dark',
    themes: { dark: { dark: true, colors: { background: '#000', surface: '#0a0a0a', primary: '#4caf50' } } },
  },
});

createApp({
  setup() {
    const drawer = ref(false);
    const url = ref('');
    const loading = ref(false);
    const result = ref(null);
    const err = ref(null);
    const ms = ref('');
    const snack = ref(false);

    const groups = [
      { t: 'ad walls', s: 'linkvertise · lootlabs · work.ink · boost.ink · adfoc.us' },
      { t: 'social unlocks', s: 'rekonise · sub2unlock · sub4unlock · sub2get · subfinal · unlocknow · ytsubme · social-unlock · socialwolvez · mboost' },
      { t: 'pastes', s: 'pastebin · rentry · justpaste · paster.so/.gg · paste-drop · pastecanyon · pastehill · pastemode' },
      { t: 'shorteners', s: 'bit.ly · tinyurl · t.co · is.gd · v.gd · tiny.cc · t.ly · rebrand.ly · rkns.link · shorter.me · cl.gy · goo.gl · tinylink.onl' },
    ];
    const hosts = 'linkvertise · lootlabs · work.ink · rekonise · sub2unlock · sub4unlock · boost.ink · pastebin · rentry · bit.ly · tinyurl · t.co · is.gd'.split(' · ');

    async function crack() {
      const u = url.value.trim();
      if (!u || loading.value) return;
      loading.value = true;
      result.value = null;
      err.value = null;
      ms.value = '';
      try {
        const r = await fetch('/api/bypass', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: u }),
        });
        const j = await r.json();
        if (j.ok) {
          result.value = j.destination;
          ms.value = j.ms;
        } else {
          err.value = j.error || 'unknown failure';
          ms.value = j.ms;
        }
      } catch (e) {
        err.value = e.message;
      }
      loading.value = false;
    }

    function copy() {
      if (result.value) navigator.clipboard.writeText(result.value);
      snack.value = true;
    }

    return { drawer, url, loading, result, err, errMsg: ref(''), ms, snack, groups, hosts, crack, copy };
  },
}).use(vuetify).mount('#app');
</script>
</body>
</html>
